<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Mini Games — Dice</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="bg"></div>

  <div class="app">
    <header class="topbar">
      <div class="topbar__left">
        <div class="title">Mini Games</div>
        <div id="subTitle" class="subtitle">Открыто вне Telegram</div>
      </div>

      <div class="topbar__right">
        <button id="soundBtn" class="pill" type="button" aria-label="Звук">
          <span class="dot"></span>
          <span id="soundText">Звук on</span>
        </button>

        <button id="bonusBtn" class="pill pill--bonus" type="button">+1000 🪙</button>

        <div class="pill pill--balance">🪙 <b id="balance">1000</b></div>
      </div>
    </header>

    <main class="card">
      <div class="cardHead">
        <div>
          <div class="h1">Dice</div>
          <div class="hint">3D кубик. Выпало число — на верхней грани точки. Честный RNG.</div>
        </div>
        <div id="rulePill" class="pill pill--ghost pill--rule">Выигрыш если выпало ≥ 2</div>
      </div>

      <section class="content">
        <div class="seg">
          <button id="btnLow" class="segBtn" type="button">Меньше</button>
          <button id="btnHigh" class="segBtn active" type="button">Больше</button>
        </div>

        <div class="statsRow">
          <div class="stat">
            <div class="label">Множитель</div>
            <div class="value"><b id="multView">x1.18</b></div>
          </div>
          <div class="stat">
            <div class="label">Возможный выигрыш</div>
            <div class="value"><b id="payoutView">+0</b> 🪙</div>
          </div>
          <div class="stat">
            <div class="label">Шанс</div>
            <div class="value"><b id="chanceView">83.3%</b></div>
          </div>
        </div>

        <div class="thresholdRow">
          <div class="thrTitle">
            <div class="h2">Порог: <b id="thrText">2</b> из 6</div>
            <div class="pill pill--ghost">Выпало: <b id="rolledText">—</b></div>
          </div>
          <input id="thrRange" class="range" type="range" min="2" max="6" value="2" />
        </div>

        <div class="diceArena">
          <div class="arenaInner">
            <div class="diceCam">
              <div id="dice" class="dice" aria-label="dice">
                <div class="face face1"><span class="pip c"></span></div>
                <div class="face face2"><span class="pip tl"></span><span class="pip br"></span></div>
                <div class="face face3"><span class="pip tl"></span><span class="pip c"></span><span class="pip br"></span></div>
                <div class="face face4">
                  <span class="pip tl"></span><span class="pip tr"></span>
                  <span class="pip bl"></span><span class="pip br"></span>
                </div>
                <div class="face face5">
                  <span class="pip tl"></span><span class="pip tr"></span>
                  <span class="pip c"></span>
                  <span class="pip bl"></span><span class="pip br"></span>
                </div>
                <div class="face face6">
                  <span class="pip tl"></span><span class="pip tr"></span>
                  <span class="pip ml"></span><span class="pip mr"></span>
                  <span class="pip bl"></span><span class="pip br"></span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="betTitle">
          <div class="h2">Ставка</div>
          <button id="bonusBtn2" class="pill pill--bonus pill--mini" type="button">+1000 🪙</button>
        </div>

        <div class="chips">
          <button class="chip" data-bet="10" type="button">10</button>
          <button class="chip" data-bet="50" type="button">50</button>
          <button class="chip" data-bet="100" type="button">100</button>
          <button class="chip" data-bet="250" type="button">250</button>
          <button class="chip" data-bet="500" type="button">500</button>
          <button class="chip" data-bet="max" type="button">MAX</button>
        </div>

        <div class="betRow">
          <button id="betMinus" class="btnSmall" type="button">−</button>
          <input id="betInput" class="betInput" type="number" min="1" step="1" value="100" />
          <button id="betPlus" class="btnSmall" type="button">+</button>
        </div>

        <button id="rollBtn" class="btnPrimary" type="button">Бросить</button>

        <div class="footNote">
          Честный RNG: <span class="muted">crypto.getRandomValues</span>. Монеты виртуальные.
        </div>
      </section>
    </main>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="./app.js"></script>
</body>
</html>
