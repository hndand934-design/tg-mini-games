<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Wheel</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="bg"></div>

  <div class="app">
    <header class="topbar">
      <div class="topbar__left">
        <div class="title">Wheel</div>
        <div id="subTitle" class="subtitle">Открыто вне Telegram</div>
      </div>

      <div class="topbar__right">
        <button id="soundBtn" class="pill" type="button" aria-label="Звук">
          <span class="dot"></span>
          <span id="soundText">Звук on</span>
        </button>

        <button id="bonusBtn" class="pill pill--bonus" type="button">+1000 🪙</button>

        <div class="pill pill--balance">🪙 <b id="balance">1000</b></div>
      </div>
    </header>

    <main class="card">
      <div class="card__inner">

        <!-- История результатов -->
        <div class="historyRow">
          <div class="historyLabel">Результаты</div>
          <div id="history" class="history" aria-label="history"></div>
        </div>

        <!-- Колесо -->
        <section class="wheelBlock">
          <div class="wheelStage">
            <div class="pointer" aria-hidden="true"></div>
            <canvas id="wheel" width="720" height="720" aria-label="wheel canvas"></canvas>

            <div class="centerRing" aria-hidden="true"></div>
          </div>
        </section>

        <!-- Кнопки множителей (как на скрине) -->
        <section class="picks" aria-label="picks">
          <button class="pick" data-m="0" type="button">
            <span class="pickTop">0.00×</span>
            <span class="pickBar c0"></span>
          </button>

          <button class="pick active" data-m="1.5" type="button">
            <span class="pickTop">1.50×</span>
            <span class="pickBar c15"></span>
          </button>

          <button class="pick" data-m="1.7" type="button">
            <span class="pickTop">1.70×</span>
            <span class="pickBar c17"></span>
          </button>

          <button class="pick" data-m="2" type="button">
            <span class="pickTop">2.00×</span>
            <span class="pickBar c20"></span>
          </button>

          <button class="pick" data-m="3" type="button">
            <span class="pickTop">3.00×</span>
            <span class="pickBar c30"></span>
          </button>

          <button class="pick" data-m="4" type="button">
            <span class="pickTop">4.00×</span>
            <span class="pickBar c40"></span>
          </button>
        </section>

        <!-- Большая кнопка -->
        <button id="spinBtn" class="btnSpin" type="button">Ставка</button>

        <!-- нижние плашки статуса -->
        <section class="miniStats">
          <div class="miniStat">
            <div class="msLabel">Статус</div>
            <div id="statusView" class="msValue">Ожидание</div>
          </div>

          <div class="miniStat">
            <div class="msLabel">Твой выбор</div>
            <div id="pickView" class="msValue">1.50×</div>
          </div>

          <div class="miniStat">
            <div class="msLabel">Результат</div>
            <div id="resultView" class="msValue">—</div>
          </div>
        </section>

        <!-- ставка -->
        <section class="betBox">
          <div class="betLine">
            <span class="betLabel">Ставка</span>
            <span class="betRight">Баланс: 🪙 <b id="balance2">1000</b></span>
          </div>

          <div class="betRow">
            <button id="betMinus" class="btnSmall" type="button">−</button>
            <input id="betInput" class="betInput" type="number" min="1" step="1" value="100" />
            <button id="betPlus" class="btnSmall" type="button">+</button>
          </div>

          <div class="chips" role="group" aria-label="chips">
            <button class="chip" data-bet="10" type="button">10</button>
            <button class="chip" data-bet="50" type="button">50</button>
            <button class="chip" data-bet="100" type="button">100</button>
            <button class="chip" data-bet="250" type="button">250</button>
            <button class="chip" data-bet="500" type="button">500</button>
            <button class="chip" data-bet="max" type="button">MAX</button>
          </div>

          <div class="footNote">
            Правило: выигрыш только при попадании на выбранный множитель. RNG: crypto.getRandomValues.
          </div>
        </section>

      </div>
    </main>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="./app.js"></script>
</body>
</html>
