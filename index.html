<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Rocket Crash</title>
  <link rel="stylesheet" href="./style.css"/>
</head>
<body>

<div class="bg"></div>

<div class="app">

  <header class="topbar">
    <div>
      <div class="title">Rocket Crash</div>
      <div id="subTitle" class="subtitle">Открыто вне Telegram</div>
    </div>

    <div class="balance">Баланс 🪙 <b id="balance">1000</b></div>
  </header>

  <main class="layout">

    <!-- LEFT -->
    <section class="left card">

      <div class="statsRow">
        <div class="stat">
          <div class="label">Множитель</div>
          <div id="multView" class="value">x1.00</div>
          <div class="hint">Ожидание</div>
        </div>

        <div class="stat">
          <div class="label">Статус</div>
          <div id="stateView" class="value">Раунд</div>
          <div id="phaseView" class="hint">Старт через 5с</div>
        </div>

        <div class="stat">
          <div class="label">Твоя ставка</div>
          <div id="betState" class="value">—</div>
          <div id="cashInfo" class="hint">не в раунде</div>
        </div>
      </div>

      <div class="graphWrap">
        <canvas id="graph"></canvas>

        <div class="overlay">
          <div id="bigX" class="bigX">1.00x</div>
          <div id="overlayText" class="overlayText">Ожидание следующего раунда</div>
        </div>

        <div class="badge sound" id="soundBtn">Звук on</div>
        <div class="badge rng">Краш-поинт скрыт (честный RNG)</div>
      </div>

      <div class="footerText" id="roundInfo">
        Новый раунд через 5с...
      </div>

    </section>

    <!-- RIGHT -->
    <section class="right card">

      <div class="sideTitle">Ставка</div>

      <div class="chips">
        <button class="chip" data-bet="10">10</button>
        <button class="chip" data-bet="50">50</button>
        <button class="chip" data-bet="100">100</button>
        <button class="chip" data-bet="250">250</button>
        <button class="chip" data-bet="500">500</button>
        <button class="chip" data-bet="max">MAX</button>
      </div>

      <div class="betRow">
        <button id="minus">−</button>
        <input id="betInput" type="number" value="100"/>
        <button id="plus">+</button>
      </div>

      <div class="btnRow">
        <button id="joinBtn" class="join">Войти в раунд</button>
        <button id="cashBtn" class="cash" disabled>Забрать</button>
      </div>

      <div class="hintSide">
        Вход только до старта. В полёте можно “Забрать”.
      </div>

    </section>

  </main>

</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="./app.js"></script>
</body>
</html>
