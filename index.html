<!-- index.html -->
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Mini Games — Wheel</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="bg"></div>

  <div class="app">
    <header class="topbar">
      <div class="topbar__left">
        <div class="title">Wheel</div>
        <div id="subTitle" class="subtitle">Открыто вне Telegram</div>
      </div>

      <div class="topbar__right">
        <button id="soundBtn" class="pill" type="button" aria-label="Звук">
          <span class="dot"></span>
          <span id="soundText">Звук on</span>
        </button>

        <button id="bonusBtn" class="pill pill--bonus" type="button">+1000 🪙</button>

        <div class="pill pill--balance">🪙 <b id="balance">1000</b></div>
      </div>
    </header>

    <main class="grid">
      <!-- LEFT -->
      <section class="card card--left">
        <div class="rowTop">
          <div class="muted">Результаты</div>
          <div id="results" class="results"></div>
        </div>

        <div class="wheelWrap">
          <div class="pointer" aria-hidden="true"></div>
          <canvas id="wheel" width="720" height="720" aria-label="Wheel"></canvas>

          <div class="centerBadge">
            <div class="centerTitle">Выбери множитель</div>
            <div class="centerSub">и нажми “Крутить”</div>
          </div>
        </div>

        <div class="picks" role="group" aria-label="Выбор множителя">
          <button class="pick" data-pick="1.5" type="button"><span class="bar bar--g"></span>1.50x</button>
          <button class="pick" data-pick="1.7" type="button"><span class="bar bar--w"></span>1.70x</button>
          <button class="pick" data-pick="2"   type="button"><span class="bar bar--y"></span>2.00x</button>
          <button class="pick" data-pick="3"   type="button"><span class="bar bar--p"></span>3.00x</button>
          <button class="pick" data-pick="4"   type="button"><span class="bar bar--o"></span>4.00x</button>
        </div>

        <button id="spinBtn" class="btnPrimary" type="button">Крутить</button>

        <div class="badges">
          <div class="badge">
            <div class="label">Статус</div>
            <div class="value"><b id="statusView">Ожидание</b></div>
          </div>
          <div class="badge">
            <div class="label">Твой выбор</div>
            <div class="value"><b id="pickView">—</b></div>
          </div>
          <div class="badge">
            <div class="label">Результат</div>
            <div class="value"><b id="resView">—</b></div>
          </div>
        </div>

        <div class="foot">
          Правило: выигрыш только при попадании в выбранный множитель. RNG: crypto.getRandomValues.
        </div>
      </section>

      <!-- RIGHT -->
      <aside class="card card--right">
        <div class="h2">Ставка</div>

        <div class="chips">
          <button class="chip" data-bet="10"  type="button">10</button>
          <button class="chip" data-bet="50"  type="button">50</button>
          <button class="chip" data-bet="100" type="button">100</button>
          <button class="chip" data-bet="250" type="button">250</button>
          <button class="chip" data-bet="500" type="button">500</button>
          <button class="chip" data-bet="max" type="button">MAX</button>
        </div>

        <div class="betRow">
          <button id="betMinus" class="btnSmall" type="button">−</button>
          <input id="betInput" class="betInput" type="number" min="1" step="1" value="100" />
          <button id="betPlus" class="btnSmall" type="button">+</button>
        </div>

        <div class="mini">
          <div class="mini__row">
            <span class="muted">Шанс</span>
            <b id="chanceView">—</b>
          </div>
          <div class="mini__row">
            <span class="muted">Потенц. выигрыш</span>
            <b id="potView">—</b>
          </div>
        </div>

        <div class="note">
          Серый сектор — проигрыш (ставить на него нельзя).
        </div>
      </aside>
    </main>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="./app.js"></script>
</body>
</html>
