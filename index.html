<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Penalty</title>
  <link rel="stylesheet" href="./style.css"/>
</head>
<body>
  <div class="app">

    <!-- TOP -->
    <header class="topbar">
      <div class="topLeft">
        <div class="wallet">💳</div>
        <div class="money" id="topMoney">0 $</div>
      </div>

      <div class="topRight">
        <button class="iconBtn" id="soundBtn" type="button">
          <span class="icon">🔊</span>
          <span class="chip" id="soundChip">on</span>
        </button>
      </div>
    </header>

    <!-- MAIN -->
    <main class="layout">
      <!-- SCENE -->
      <section class="goalWrap">
        <div class="goalTitleRow">
          <div class="goalTitle">Пенальти</div>
          <div class="goalMeta">
            <div class="pill">Шаг: <b id="stepText">0</b></div>
            <div class="pill">X: <b id="xTextTop">x1.76</b></div>
          </div>
        </div>

        <div class="goalFrame" id="goalFrame">
          <div class="goalNet" aria-hidden="true"></div>
          <div class="goalPosts" aria-hidden="true"></div>

          <!-- TARGETS -->
          <div class="targets" id="targets" aria-label="Зоны удара"></div>

          <!-- KEEPER (one element) -->
          <div class="keeper" id="keeper" aria-hidden="true">
            <span class="gloves">🧤🧤</span>
          </div>

          <!-- BALL -->
          <div class="ball" id="ball" aria-hidden="true">⚽</div>

          <!-- FX -->
          <div class="fx" id="fx" aria-hidden="true"></div>

          <!-- OVERLAY (only appears after result) -->
          <div class="overlay" id="overlay" hidden>
            <div class="overlayCard" role="dialog" aria-modal="true">
              <div class="overlayTitle" id="overlayTitle">ГОЛ!</div>
              <div class="overlaySub" id="overlaySub">+0 ₽</div>
              <button class="overlayBtn" id="overlayOk" type="button">Ок</button>
            </div>
          </div>
        </div>

        <div class="legend">
          <span class="dot good"></span> гол
          <span class="sep"></span>
          <span class="dot bad"></span> сейв
        </div>
      </section>

      <!-- CONTROLS -->
      <section class="panel">
        <div class="panelTitle">Управление</div>

        <div class="balanceRow">
          <div class="balBox">
            Баланс:
            <b id="balText">1000 ₽</b>
          </div>
          <button class="ghostBtn" id="addMoneyBtn" type="button">+1000 ₽</button>
        </div>

        <!-- Multipliers -->
        <div class="multiRow" id="multiRow">
          <button class="multiBtn active" type="button" data-m="1.76">1.76x</button>
          <button class="multiBtn" type="button" data-m="3.30">3.30x</button>
          <button class="multiBtn" type="button" data-m="7.08">7.08x</button>
          <button class="multiBtn" type="button" data-m="15.17">15.17x</button>
          <button class="multiBtn" type="button" data-m="45.52">45.52x</button>
        </div>

        <!-- Series -->
        <div class="seriesRow">
          <div class="seriesLabel">Серия</div>
          <label class="switch">
            <input type="checkbox" id="seriesToggle"/>
            <span class="slider"></span>
          </label>
          <div class="seriesInfo">
            Побед подряд: <b id="streakText">0</b>
          </div>
        </div>

        <!-- Bet -->
        <div class="betCard">
          <div class="betTop">
            <div class="betLabel">Ставка</div>
            <div class="betValue" id="betText">100 ₽</div>
          </div>

          <div class="betGrid">
            <button class="pmBtn" id="minusBtn" type="button">−</button>
            <button class="pmBtn" id="plusBtn" type="button">+</button>
            <button class="smallBtn" id="halfBtn" type="button">/2</button>
            <button class="smallBtn" id="doubleBtn" type="button">x2</button>
          </div>

          <button class="stakeBtn" id="stakeBtn" type="button">
            <span>Ставка</span>
            <span class="ballIco">⚽</span>
          </button>

          <div class="hint">
            1) Выбери множитель<br/>
            2) Жми <b>Ставка</b><br/>
            3) Кликни по кругу (5×3)
          </div>
        </div>

        <div class="statusRow">
          <div class="statusBox">
            Статус: <b id="statusText">Ожидание</b>
          </div>
          <div class="statusBox">
            Последнее: <b id="lastText">—</b>
          </div>
        </div>

        <div class="bottomBtns">
          <button class="resetBtn" id="resetBtn" type="button">Сброс</button>
        </div>
      </section>
    </main>

  </div>

  <script src="./app.js"></script>
</body>
</html>
