<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>RPS</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

<div class="bg"></div>

<div class="app">
  <header class="topbar">
    <div>
      <div class="title">RPS</div>
      <div class="subtitle">Камень • Ножницы • Бумага</div>
    </div>

    <div class="topbar__right">
      <button id="soundBtn" class="pill"><span class="dot"></span>Звук on</button>
      <div class="pill pill--balance">Баланс <b id="balance">1000</b> ₽</div>
    </div>
  </header>

  <div class="layout">
    <section class="card left">

      <div class="badges">
        <div class="badge"><div class="label">Статус</div><div id="status" class="value">Ожидание</div></div>
        <div class="badge"><div class="label">Твой выбор</div><div id="youPick" class="value">—</div></div>
        <div class="badge"><div class="label">Бот</div><div id="botPick" class="value">—</div></div>
        <div class="badge"><div class="label">Результат</div><div id="result" class="value">—</div></div>
      </div>

      <div class="ladderWrap">
        <div class="ladderHead">
          <div class="h2">Лестница</div>
          <div class="muted">Выигрывай подряд — X растёт.</div>
        </div>
        <div id="ladder" class="ladder"></div>
      </div>

      <div class="seriesRow">
        <div class="panel"><div class="label">Серия</div><div id="series" class="big">0 побед</div></div>
        <div class="panel"><div class="label">Текущий X</div><div id="mult" class="big">x1.00</div></div>
        <div class="panel"><div class="label">Потенциал</div><div id="potential" class="big">0 ₽</div></div>
      </div>

      <div class="vsRow">
        <div class="vsCard">
          <div class="cap">Бот</div>
          <div id="botIcon" class="icon">✊🏻</div>
          <div class="ready">Готов</div>
        </div>

        <div class="vsMid">VS</div>

        <div class="vsCard">
          <div class="cap">Ты</div>
          <div id="youIcon" class="icon">✊🏻</div>
          <div class="ready">Готов</div>
        </div>
      </div>

      <div class="pickBar">
        <button class="pickBtn" data-move="rock">✊🏻 Камень</button>
        <button class="pickBtn" data-move="scissors">✌🏻 Ножницы</button>
        <button class="pickBtn" data-move="paper">✋🏻 Бумага</button>
      </div>

      <div class="foot muted">Нажми выбор → Играть.</div>
    </section>

    <section class="card right">
      <div class="rightHead"><div class="h2">Ставка</div></div>

      <div class="chips">
        <button class="chip" data-bet="10">10</button>
        <button class="chip" data-bet="50">50</button>
        <button class="chip" data-bet="100">100</button>
        <button class="chip" data-bet="250">250</button>
        <button class="chip" data-bet="500">500</button>
        <button class="chip" data-bet="max">MAX</button>
      </div>

      <div class="betRow">
        <button id="minus" class="btnSmall">−</button>
        <input id="bet" class="betInput" value="100" />
        <button id="plus" class="btnSmall">+</button>
      </div>

      <div class="actions">
        <button id="play" class="btnPrimary">Играть</button>
        <button id="cashout" class="btnGhost" disabled>Забрать</button>
      </div>

      <div class="winBox">
        <div>Выигрыш:</div>
        <div id="win" class="winValue">0 ₽</div>
      </div>
    </section>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
