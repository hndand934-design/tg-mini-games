<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Telegram Mini Games</title>
  <link rel="stylesheet" href="./style.css?v=9" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">🎮</div>
        <div>
          <div class="title">Mini Games</div>
          <div id="user" class="sub">Открыто вне Telegram</div>
        </div>
      </div>

      <div class="rightbar">
        <div class="pill">
          <span class="dot"></span>
          <span>🪙</span>
          <b id="coins">0</b>
        </div>
        <button id="soundBtn" class="iconBtn" title="Звук">🔊</button>
      </div>
    </header>

    <main class="main">
      <div id="screen"></div>
    </main>

    <nav class="nav">
      <button data-screen="menu">Меню</button>
      <button data-screen="crash">Crash</button>
      <button data-screen="mines">Mines</button>
      <button data-screen="wheel">Wheel</button>
      <button data-screen="rps">RPS</button>
      <button data-screen="penalty">Penalty</button>
      <button data-screen="tower">Tower</button>
      <button data-screen="coin">Coin</button>
      <button data-screen="dice">Dice</button>
    </nav>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="./app.js?v=9"></script>
</body>
</html>
