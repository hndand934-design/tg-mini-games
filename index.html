<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Wheel</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="bg"></div>

  <div class="app">
    <header class="topbar">
      <div class="topbar__left">
        <div class="title">Wheel</div>
        <div id="subTitle" class="subtitle">Открыто вне Telegram</div>
      </div>

      <div class="topbar__right">
        <button id="soundBtn" class="pill" type="button" aria-label="Звук">
          <span class="dot"></span>
          <span id="soundText">Звук on</span>
        </button>

        <div class="pill pill--balance">🪙 <b id="balance">1000</b></div>
      </div>
    </header>

    <main class="layout">
      <!-- LEFT: wheel -->
      <section class="panel panel--wheel">
        <div class="stats">
          <div class="stat">
            <div class="label">Статус</div>
            <div id="statusView" class="value">Ожидание</div>
          </div>
          <div class="stat">
            <div class="label">Твой выбор</div>
            <div id="pickView" class="value">—</div>
          </div>
          <div class="stat">
            <div class="label">Результат</div>
            <div id="resultView" class="value">—</div>
          </div>
        </div>

        <div class="wheelWrap">
          <div class="wheelStage">
            <div class="pointer"></div>
            <canvas id="wheel" width="720" height="720" aria-label="wheel"></canvas>

            <div class="centerBadge">
              <div class="centerTitle">Выбери фракцию</div>
              <div class="centerSub">и нажми “Крутить”</div>
            </div>
          </div>
        </div>

        <div class="factions" aria-label="factions">
          <button class="faction" data-m="1.2" type="button"><span class="dotc d12"></span><b>1.20x</b></button>
          <button class="faction" data-m="1.5" type="button"><span class="dotc d15"></span><b>1.50x</b></button>
          <button class="faction" data-m="2" type="button"><span class="dotc d20"></span><b>2.00x</b></button>
          <button class="faction" data-m="3" type="button"><span class="dotc d30"></span><b>3.00x</b></button>
          <button class="faction" data-m="5" type="button"><span class="dotc d50"></span><b>5.00x</b></button>
          <button class="faction" data-m="10" type="button"><span class="dotc d100"></span><b>10.00x</b></button>
        </div>

        <div class="rule">
          Правило: если выпало на твою фракцию — выигрываешь ×множитель, иначе ставка сгорает.
        </div>
      </section>

      <!-- RIGHT: bet -->
      <aside class="panel panel--bet">
        <div class="betHead">
          <div class="h2">Ставка</div>
          <button id="bonusBtn" class="pill pill--bonus" type="button">+1000 🪙</button>
        </div>

        <div class="chips" role="group" aria-label="chips">
          <button class="chip" data-bet="10" type="button">10</button>
          <button class="chip" data-bet="50" type="button">50</button>
          <button class="chip" data-bet="100" type="button">100</button>
          <button class="chip" data-bet="250" type="button">250</button>
          <button class="chip" data-bet="500" type="button">500</button>
          <button class="chip" data-bet="max" type="button">MAX</button>
        </div>

        <div class="betRow">
          <button id="betMinus" class="btnSmall" type="button">−</button>
          <input id="betInput" class="betInput" type="number" min="1" step="1" value="100" />
          <button id="betPlus" class="btnSmall" type="button">+</button>
        </div>

        <button id="spinBtn" class="btnPrimary" type="button">Крутить</button>

        <div class="betHint">
          Выбери фракцию снизу. Шанс зависит от количества её секторов.
        </div>

        <div class="version">v1 — режим Wheel</div>
      </aside>
    </main>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="./app.js"></script>
</body>
</html>
